version: '3.8'

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: atlas-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/atlaspassword123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allow__csv=apoc.*
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_export_file_enabled=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  atlas-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-server
    restart: unless-stopped
    depends_on:
      - neo4j
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Neo4j__Uri=bolt://neo4j:7687
      - Neo4j__User=neo4j
      - Neo4j__Password=atlaspassword123
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

volumes:
  neo4j_data:
  neo4j_logs:
