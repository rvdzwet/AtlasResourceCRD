name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup .NET 10
      uses: actions/setup-dotnet@87e7704cf70b0f42cb300d8904cb156f6904e5ec # v4.3.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build & Test
      run: dotnet test --configuration Release

    - name: Pack CLI Tool
      run: dotnet pack src/AtlasResourceCRD.Cli/AtlasResourceCRD.Cli.csproj --configuration Release --output nupkg

    - name: Publish CLI Binaries
      run: dotnet publish src/AtlasResourceCRD.Cli/AtlasResourceCRD.Cli.csproj --configuration Release -r win-x64 --self-contained false -o publish/win-x64

    - name: Zip Windows Binaries
      run: |
        cd publish/win-x64
        zip -r ../../atlas-crd-win-x64.zip .
        cd ../..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@c95c1de6b746aab24e29233dce783f18186709ab # v2.2.1
      with:
        files: |
          atlas-crd-win-x64.zip
          nupkg/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
