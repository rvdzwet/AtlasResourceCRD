name: CI Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore Atlas.slnx

      - name: Build Solution
        run: dotnet build Atlas.slnx --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test Atlas.slnx --no-build --configuration Release --verbosity normal
